###############################################################################
# Baobab Enterprise Platform
###############################################################################
#
# File        : ruff.toml
# Repository  : https://github.com/nabhold/baobab
# Organization: NABHOLD Group Africa
#
#------------------------------------------------------------------------------
# PURPOSE
#------------------------------------------------------------------------------
#
# Ruff is the authoritative formatter and linter for the Baobab platform.
#
# Responsibilities
# ----------------
#
# • Python formatting
# • Static code analysis
# • Import sorting
# • Style enforcement
# • Bug detection
# • Modern Python upgrades
#
# Documentation
# -------------
#
# https://docs.astral.sh/ruff/
#
###############################################################################

###############################################################################
# Global Configuration
###############################################################################

target-version = "py314"

line-length = 88

indent-width = 4

###############################################################################
# Files & Directories
###############################################################################

exclude = [

    ".git",

    ".github",

    ".venv",

    ".pytest_cache",

    ".ruff_cache",

    "__pycache__",

    "node_modules",

    "dist",

    "build",

    "site",

]

###############################################################################
# Formatting
###############################################################################

[format]

quote-style = "double"

indent-style = "space"

line-ending = "lf"

docstring-code-format = true

skip-magic-trailing-comma = false

###############################################################################
# Linting
###############################################################################

[lint]

select = [

    # pycodestyle
    "E",

    # pyflakes
    "F",

    # isort
    "I",

    # pyupgrade
    "UP",

    # flake8-bugbear
    "B",

    # simplify
    "SIM",

    # comprehensions
    "C4",

    # pathlib
    "PTH",

    # return statements
    "RET",

    # raise statements
    "RSE",

    # unused arguments
    "ARG",

    # logging
    "LOG",

    # security
    "S",

]

ignore = [

    # Allow assert in tests
    "S101",

]

###############################################################################
# Import Sorting
###############################################################################

[lint.isort]

combine-as-imports = true

force-single-line = false

known-first-party = [

    "baobab",

]

###############################################################################
# Per-file Overrides
###############################################################################

[lint.per-file-ignores]

"tests/**/*.py" = [

    "S101",

]

###############################################################################
# End of File
###############################################################################
