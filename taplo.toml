###############################################################################

###############################################################################
# Global Formatting Options
###############################################################################

include = [
    "**/*.toml",
]

exclude = [
    ".git/**",
    ".venv/**",
    "node_modules/**",
    "build/**",
    "dist/**",
    "site/**",
]

###############################################################################
# Formatting Rules
###############################################################################

[formatting]

# Align consecutive values where appropriate.
align_entries = true

# Align comments in arrays and tables.
align_comments = true

# Preserve the order in which tables appear.
reorder_keys = false

# Add a trailing newline to every file.
trailing_newline = true

# Use Unix-style line endings.
crlf = false

# Indent nested structures with four spaces.
indent_string = "    "

# Expand arrays when they become long.
array_auto_expand = true

# Collapse short arrays onto a single line.
array_auto_collapse = true

# Keep compact inline tables where practical.
compact_inline_tables = true

# Compact arrays when possible.
compact_arrays = true

# Allow a trailing comma in multiline arrays.
trailing_comma = true

# Keep blank lines between logical sections.
allowed_blank_lines = 2

###############################################################################
# End of File
###############################################################################
