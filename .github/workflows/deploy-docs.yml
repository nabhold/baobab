# ==============================================================================
# GitHub Actions CI/CD Pipeline: Build & Deploy GitHub Pages Documentation
# File: .github/workflows/deploy-docs.yml
#
# Purpose:
#   Build the Zensical documentation site and deploy it to GitHub Pages.
#
# Security model:
#   - Every GitHub/Astral action is pinned to a full 40-character commit SHA.
#   - No floating action tags are permitted.
#   - Least-privilege permissions are used.
#   - uv.lock is enforced during CI.
# ==============================================================================

name: Deploy GitHub Pages Documentation

# ------------------------------------------------------------------------------
# 1. Execution Triggers
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/deploy-docs.yml"

  workflow_dispatch:

# ------------------------------------------------------------------------------
# 2. Permissions
#
# contents: read
#   Required to checkout the repository.
#
# actions: read
#   Required by deploy-pages to retrieve the Pages artifact.
#
# pages: write
#   Required to create/update the GitHub Pages deployment.
#
# id-token: write
#   Required for GitHub Pages OIDC authentication.
# ------------------------------------------------------------------------------
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# ------------------------------------------------------------------------------
# 3. Concurrency
# ------------------------------------------------------------------------------
concurrency:
  group: pages
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# 4. Build and Deploy
# ------------------------------------------------------------------------------
jobs:
  build-and-deploy:

    name: Build and Deploy Documentation

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ------------------------------------------------------------------------
      # A. Checkout Repository
      # ------------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # B. Install uv
      #
      # setup-uv v8.1.0
      # Full immutable commit SHA.
      # ------------------------------------------------------------------------
      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      # ------------------------------------------------------------------------
      # C. Set Up Python
      # ------------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version

      # ------------------------------------------------------------------------
      # D. Install Documentation Dependencies
      #
      # --locked prevents uv from modifying the lockfile.
      # ------------------------------------------------------------------------
      - name: Install Documentation Dependencies
        run: uv sync --locked --only-group docs

      # ------------------------------------------------------------------------
      # E. Bundle Modular CSS
      # ------------------------------------------------------------------------
      - name: Bundle Modular CSS
        shell: bash
        run: |
          set -euo pipefail

          CSS_DIR="docs/assets/stylesheets"
          ENTRY_FILE="${CSS_DIR}/extra.css"
          BUNDLE_FILE="${CSS_DIR}/bundle.css"

          if [[ ! -f "$ENTRY_FILE" ]]; then
            echo "::error::CSS entry point not found: $ENTRY_FILE"
            exit 1
          fi

          cd "$CSS_DIR"

          IMPORTS="$(
            grep -E '^@import' extra.css \
              | sed -E "s/.*url\\(['\"]?([^'\"]+)['\"]?\\).*/\\1/" \
              || true
          )"

          if [[ -n "$IMPORTS" ]]; then

            : > "$BUNDLE_FILE"

            while IFS= read -r file; do

              [[ -z "$file" ]] && continue

              if [[ ! -f "$file" ]]; then
                echo "::error::Imported CSS file not found: $file"
                exit 1
              fi

              cat "$file" >> "$BUNDLE_FILE"
              printf '\n' >> "$BUNDLE_FILE"

            done <<< "$IMPORTS"

            mv "$BUNDLE_FILE" "$ENTRY_FILE"

            echo "CSS successfully bundled into extra.css."

          else

            echo "No CSS imports found."
            echo "Existing extra.css retained."

          fi

      # ------------------------------------------------------------------------
      # F. Build Zensical Site
      # ------------------------------------------------------------------------
      - name: Build Static Site with Zensical
        run: uv run zensical build

      # ------------------------------------------------------------------------
      # G. Upload Pages Artifact
      #
      # IMPORTANT:
      #
      # We intentionally use actions/upload-artifact directly instead of
      # actions/upload-pages-artifact.
      #
      # This repository requires ALL actions to be pinned to full commit SHAs.
      #
      # upload-pages-artifact internally invokes actions/upload-artifact@v4.
      # That internal dependency cannot be independently pinned from this
      # workflow, which conflicts with the repository's policy.
      #
      # Therefore we explicitly upload the artifact ourselves.
      # ------------------------------------------------------------------------
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-artifact@4cec3d8a7d5c4d1d4a1c7c0d0e5f5f4b0f4e7c1d # v4
        with:
          name: github-pages
          path: site/
          if-no-files-found: error
          retention-days: 1

      # ------------------------------------------------------------------------
      # H. Deploy GitHub Pages
      #
      # deploy-pages v4 requires:
      #   - actions: read
      #   - pages: write
      #   - id-token: write
      #
      # It also expects a v4 artifact.
      # ------------------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
