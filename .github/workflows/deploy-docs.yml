# ==============================================================================
# GitHub Actions CI/CD Pipeline: Build & Deploy GitHub Pages Documentation
# File Location: baobab/.github/workflows/deploy-docs.yml
# Rationale: Automates static site building with Zensical and deploys to GitHub Pages
#            with strict link checks and uv dependency management.
# ==============================================================================

name: Deploy GitHub Pages Documentation

# ------------------------------------------------------------------------------
# 1. Execution Triggers
# Rationale: Triggers deployment only on changes to main that affect documentation
#            files or pipeline settings, avoiding unnecessary builds.
# ------------------------------------------------------------------------------
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"                        # Markdown source files
      - "zensical.toml"                  # Navigation and theme config
      - "pyproject.toml"                 # Dependency definitions
      - ".python-version"                # Exact interpreter pin (added v1.1 — Step C now reads this file directly, see below)
      - ".github/workflows/deploy-docs.yml" # Pipeline file itself
  workflow_dispatch:                     # Allows manual triggering from GitHub UI

# ------------------------------------------------------------------------------
# 2. Identity & Permission Scope (Least Privilege Model)
# Rationale: Required for GitHub Pages OIDC deployment without static deployment tokens.
# ------------------------------------------------------------------------------
permissions:
  contents: read      # Read code repository
  pages: write        # Write compiled HTML artifact to GitHub Pages
  id-token: write     # Cryptographic OIDC token issuance for deployment verification

# ------------------------------------------------------------------------------
# 3. Pipeline Concurrency Management
# Rationale: Prevents race conditions by cancelling out-of-date runs when multiple
#            commits arrive in quick succession.
# ------------------------------------------------------------------------------
concurrency:
  group: "pages"
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# 4. Job Steps: Build and Publish Static HTML Site
# ------------------------------------------------------------------------------
jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # Step A: Checkout source code from repository
      # Rationale: fetch-depth: 0 (full history) is required, not optional —
      #            mkdocs-git-revision-date-localized-plugin needs the full
      #            commit history per file to compute "last updated" dates.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Step B: Install Astral uv for ultra-fast dependency isolation
      # Rationale: Pinned to the latest verified v8 immutable tag to prevent
      #            supply-chain drift.
      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      # Step C: Setup Python engine version
      # Rationale: Reads .python-version directly to guarantee the CI runner
      #            and local developer environments match at the patch level.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      # Step D: Install documentation group dependencies using uv lock synchronization
      - name: Install Documentation Dependencies
        run: uv sync --only-group docs

      # Step E: Native CSS Bundling
      # Rationale: The docs/assets/css/extra.css file utilizes multiple @import rules
      #            for developer maintainability. To prevent blocking HTTP requests on
      #            the client, this step parses those imports, concatenates the files
      #            in their declared order, and overwrites extra.css prior to MkDocs
      #            compilation. This achieves CSS bundling natively without introducing
      #            Node.js/NPM into a pure Python/uv pipeline.
      - name: Bundle Modular CSS
        run: |
          cd docs/stylesheets

          # 1. Extract the filenames from the @import url("..."); declarations
          FILES=$(grep -E "^@import" extra.css | sed -E "s/.*url\(['\"]?([^'\"]+)['\"]?\).*/\1/")

          # 2. Concatenate the targeted files into a single temporary bundle
          if [ ! -z "$FILES" ]; then
            cat $FILES > bundle.css

            # 3. Overwrite extra.css with the bundled content, eliminating the imports
            mv bundle.css extra.css
            echo "CSS successfully bundled into a single extra.css artifact."
          else
            echo "No CSS imports found to bundle."
          fi

      # Step F: Compile Markdown source files into static HTML
      # Rationale: --strict causes the build to fail if broken links or syntax errors exist
      - name: Build Static Site with Zensical
        run: uv run zensical build

      # Step G: Upload site output artifact for GitHub Pages deployer
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/"

      # Step H: Publish uploaded artifact to GitHub Pages host endpoint
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
