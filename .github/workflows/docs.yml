# Name displayed in the GitHub Actions tab
name: Documentation

# Triggers defining when this workflow runs
on:
  push:
    # Run automatically whenever commits are pushed to 'master' or 'main'
    branches:
      - master
      - main

# Explicit token permissions required for GitHub Pages deployment via OIDC
permissions:
  contents: read     # Read access to pull repository source code
  pages: write        # Write access to publish content to GitHub Pages
  id-token: write     # Access to request OpenID Connect (OIDC) authentication tokens

# Prevents concurrent deployments from overwriting each other on GitHub Pages
concurrency:
  group: "pages"
  cancel-in-progress: false # Queue deployments instead of canceling active builds

jobs:
  deploy:
    # Set deployment environment details to link deployment state and URL in GitHub UI
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Automatically populates URL from step output

    # Operating system of the GitHub-hosted runner instance
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner.
      # Must be executed first so subsequent steps have access to workspace files.
      # Pinned to a 40-character commit SHA to satisfy repository security requirements.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Step 2: Initialize GitHub Pages setup and verify environment readiness.
      # SHA-pinned for supply-chain security compliance.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Step 3: Install and configure Python on the runner host.
      # SHA-pinned for supply-chain security compliance.
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.x"

      # Step 4: Install the documentation generator build tool via pip.
      - name: Install dependencies
        run: pip install zensical

      # Step 5: Execute the site generator to build static files into the target folder.
      - name: Build site
        run: zensical build --clean

      # Step 6: Compress and upload the static site folder as a deployable artifact.
      # SHA-pinned for supply-chain security compliance.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site # Specifies the build directory generated by Zensical

      # Step 7: Deploy the uploaded artifact to the GitHub Pages environment.
      # SHA-pinned for supply-chain security compliance.
      - name: Deploy to GitHub Pages
        id: deployment # Step ID referenced above in environment.url
        uses: actions/deploy-pages@d6db5d6b50d748d0570b424a148f72e0316a50e9 # v4.0.5
