# ==============================================================================
# Baobab Enterprise Platform
# ==============================================================================
#
# File        : mkdocs.yml
# Repository  : https://github.com/nabhold/baobab
# Organization: NABHOLD Group Africa
#
# ------------------------------------------------------------------------------
# PURPOSE
# ------------------------------------------------------------------------------
#
# This file is the authoritative configuration for the Baobab documentation
# platform.
#
# Responsibilities
# ----------------
#
# • Documentation site metadata
# • Navigation hierarchy
# • Theme configuration
# • Plugins
# • Markdown extensions
# • GitHub integration
# • Search
# • Static asset generation
#
# Documentation Source
# --------------------
#
#     docs/
#
# Generated Output
# ----------------
#
#     site/
#
# Documentation Generator
# -----------------------
#
#     MkDocs 1.7+
#
# Theme
# -----
#
# Material for MkDocs is currently used as the presentation layer.
#
# The documentation structure intentionally remains independent of any
# specific theme so that a future migration requires only minimal changes.
#
# ==============================================================================

# ==============================================================================
# Site Metadata
# ==============================================================================

site_name: Baobab Enterprise Platform

site_description: >
  Enterprise Multi-Tenant Digital Commerce Platform Documentation

site_author: NABHOLD Group Africa

site_url: https://nabhold.github.io/baobab/

repo_name: nabhold/baobab

repo_url: https://github.com/nabhold/baobab

edit_uri: edit/main/docs/

copyright: >
  Copyright © NABHOLD Group Africa.
  All Rights Reserved.

docs_dir: docs

site_dir: site

# Fail CI builds on missing pages, broken navigation or invalid links.
strict: true

# ==============================================================================
# Theme
# ==============================================================================

theme:

  name: material

  language: en

  favicon: resources/branding/favicon.ico

  logo: resources/branding/logo.svg

  palette:

    - media: "(prefers-color-scheme: light)"
      scheme: default

      primary: green
      accent: emerald

      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate

      primary: green
      accent: emerald

      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:

    # Navigation

    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow

    # Search

    - search.suggest
    - search.highlight
    - search.share

    # Content

    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view

# ==============================================================================
# Plugins
# ==============================================================================

plugins:

  - search

  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

  - git-revision-date-localized:
      enable_creation_date: true

  - redirects

  - minify:
      minify_html: true

# ==============================================================================
# Markdown Extensions
# ==============================================================================

markdown_extensions:

  - admonition

  - attr_list

  - def_list

  - footnotes

  - md_in_html

  - tables

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.keys

  - pymdownx.mark

  - pymdownx.smartsymbols

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.superfences:
      custom_fences:

        - name: mermaid
          class: mermaid
          format: "!!python/name:pymdownx.superfences.fence_code_format"

# ==============================================================================
# Navigation
#
# NOTE
# ----
# Every navigation entry should point to an existing document.
#
# Documentation is organised by architecture rather than by technology.
#
# ==============================================================================

nav:

  - Home:
      - Introduction: index.md

  - Architecture:
      - Overview: architecture/index.md
      - Specifications: specifications/index.md
      - ADRs: adr/index.md
      - Diagrams: diagrams/index.md

  - Governance:
      - Overview: governance/index.md
      - Engineering Handbook: governance/engineering-handbook.md
      - Coding Standards: governance/coding-standards.md
      - Testing Standards: governance/testing-standards.md
      - Documentation Standards: governance/documentation-standards.md

  - Operations:
      - Runbooks: runbooks/index.md

# ==============================================================================
# Validation
# ==============================================================================

validation:

  omitted_files: warn

  absolute_links: warn

  unrecognized_links: warn

# ==============================================================================
# End of File
# ==============================================================================
