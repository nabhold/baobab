#
#                         BAOBAB ENTERPRISE PLATFORM
#
#    ------------------------------------------------------------------
#
# File
# ----
#     bandit.yaml
#
# Tool
# ----
#     Bandit (Python static application security testing / SAST)
#
# Referenced by
# --------------
#     pyproject.toml → [project.optional-dependencies] → security
#
# Invocation
# ----------
#     uv run bandit -c bandit.yaml -r <target-path>
#
#     Example, once a real service exists:
#         uv run bandit -c bandit.yaml -r services/backend
#
#     Whole-repository scan (once workspace members are populated with real
#     source; currently every candidate directory is a `.gitkeep`
#     placeholder, so a repo-wide run will simply find nothing to scan):
#         uv run bandit -c bandit.yaml -r .
#
#
# PURPOSE
# -------
#
# This file is Bandit's dedicated configuration, per the "TOOL CONFIGURATION
# REGISTRY" documented in the repository root pyproject.toml. Bandit config
# is intentionally kept out of pyproject.toml so that:
#
#   • security policy has a single, obvious, git-blameable home
#   • the file can be pointed at by name from CI without any TOML
#     table-path knowledge
#   • it stays independently versionable from packaging/dependency changes
#
#
# SCOPE STATUS AT TIME OF AUTHORING
# ----------------------------------
#
# As of this revision, every planned Python workspace member
# (services/backend, services/ai, services/worker, shared/python,
# packages/python, sdk/python) is a PLACEHOLDER containing only a
# `.gitkeep` — see the "UV WORKSPACE READINESS ROADMAP" in the root
# pyproject.toml. This configuration is written to be correct and useful
# from day one of real code landing in those directories, without needing
# rework — it does not hardcode paths that don't exist yet.
#
# ACTION ITEM: once services/backend (Django) exists with real code, revisit
# the `assert_used` skip below — Django test files conventionally use
# `assert`, and this config already anticipates that; re-verify the glob
# still matches the real test layout once one exists.
#
#
# POLICY RATIONALE
# -----------------
#
#   • exclude_dirs: standard non-source directories that would otherwise
#     produce noise (virtual envs, build artefacts, dependency caches,
#     generated migrations). Migrations are excluded because Django
#     auto-generates them and they are not hand-audited application logic.
#
#   • Severity/confidence thresholds are enforced on the command line by CI
#     (bandit's `-lll`/`-iii` flags or `--severity-level` /
#     `--confidence-level`), not in this file, since Bandit's YAML schema
#     does not expose a first-class "fail the build at X" threshold key —
#     keeping that in the CI workflow (.github/workflows/security.yml)
#     keeps the enforcement policy visible where builds actually fail.
#     Recommended CI invocation:
#         uv run bandit -c bandit.yaml -r <path> -ll -ii
#     (fail on MEDIUM+ severity, MEDIUM+ confidence — LOW/LOW findings are
#     still reported but do not fail the build).
#
#   • No blanket `skips` of rule IDs are defined at the global level. A
#     global skip silently suppresses a rule everywhere, including future
#     code that may not deserve the exemption. Narrow, per-context
#     exemptions (like `assert_used` below, which is a Bandit-native
#     per-plugin setting rather than a blanket skip) are preferred.
#
#
exclude_dirs:
  - ".venv"
  - "venv"
  - ".git"
  - ".devcontainer"
  - "build"
  - "dist"
  - "site"                 # MkDocs build output
  - "node_modules"
  - "**/migrations"         # Django-generated, not hand-authored logic
  - "**/__pycache__"
  - "tests"                 # covered by pytest + code review, not SAST
  - "docs"

# Per-plugin configuration.
#
# `assert_used` (B101) flags `assert` statements because Python strips them
# under `-O` optimisation, making them unsafe for runtime invariant checks
# in production code. Test files are a legitimate, idiomatic exception —
# pytest relies on bare `assert` — so test paths are exempted here rather
# than disabling B101 globally, which would also hide misuse of `assert`
# in real application/service code.
assert_used:
  skips:
    - "*_test.py"
    - "*/tests/*.py"
    - "*/test_*.py"

# `hardcoded_password_string` / `hardcoded_password_funcarg` (B105/B106) use
# a built-in wordlist of common password variable names. No overrides yet —
# revisit once services/backend (Django, with settings.py-style config) has
# real code, since Django convention names like `SECRET_KEY` should always
# be flagged if ever hardcoded rather than sourced from environment/secrets
# management, so no exemption is added preemptively.
