#
#  MAINTENANCE GUIDELINES
#
# Repository Maintainers
# ----------------------
#
# • Keep dependency groups focused and minimal.
# • Prefer version ranges over exact version pins unless strict reproducibility
#   is required.
# • Review dependency updates regularly.
# • Regenerate the UV lock file after dependency changes.
# • Avoid adding application runtime dependencies to the repository root.
# • Keep the "UV WORKSPACE READINESS ROADMAP" status table current — it is
#   the single source of truth for what is safe to enroll as a workspace
#   member.
#
# Developer Workflow
# ------------------
#
# Initial setup
#
#     uv sync
#
# Install every optional dependency
#
#     uv sync --all-groups
#
# Documentation
#
#     uv sync --group docs
#
# Testing
#
#     uv sync --group test
#
# Security
#
#     uv sync --group security
#
# Lock dependencies
#
#     uv lock
#
# Update dependencies
#
#     uv lock --upgrade
#
#
#  DOCUMENTATION BUILD & PUBLISH — CORRECT UV COMMANDS
# -----------------------------------------------------
#
# This section exists specifically to prevent the error class observed
# previously: running `uv build` or `uv publish` against the repository
# root in an attempt to "publish the docs." Those two commands are for
# building and uploading a *Python package* to a package index (PyPI or
# private index) and belong to the `release` group / individual service
# projects — they are unrelated to MkDocs and will fail at the root
# because `package = false` is set above (there is nothing to build).
#
# Documentation model: single-version, forward-only (see the ARCHITECTURE
# DECISION note under the `docs` group above for the full rationale —
# `mike` and versioned docs were deliberately rejected, not merely
# forgotten). There is exactly one published version of the docs at any
# time; publishing simply overwrites it.
#
# Documentation lives in `docs/` and is built/served with MkDocs directly,
# run through `uv run` so it executes inside the project's managed
# environment:
#
#   1. Ensure the docs tooling is installed
#          uv sync --group docs
#      (already included by default via `default-groups`, so a plain
#      `uv sync` is normally sufficient)
#
#   2. Build the static site locally (output to ./site, for inspection only)
#          uv run mkdocs build --strict --site-dir site
#      `--site-dir site` matches the directory
#      `.github/workflows/deploy-docs.yml` uploads via
#      `actions/upload-pages-artifact`; keep both in sync if either changes.
#      `--strict` matches mkdocs.yml's own `strict: true` — running it
#      explicitly here too means a broken link is caught locally, before
#      CI, not just in CI.
#
#   3. Serve the docs locally with live reload during authoring
#          uv run mkdocs serve
#
#   4. Publishing to production is CI-only and requires no local/manual
#      command: pushing to `main` with changes under the paths listed in
#      `.github/workflows/deploy-docs.yml`'s trigger (or a manual
#      `workflow_dispatch`) runs the build above and hands the `site/`
#      artifact to `actions/upload-pages-artifact` +
#      `actions/deploy-pages`, which deploy it directly to the GitHub
#      Pages environment via OIDC. There is no branch push, no `git`
#      credentials, and no `contents: write` permission involved — this is
#      the entire point of the architecture decision above.
#
# Do not run `uv build` / `uv publish` for documentation purposes under any
# circumstances — those remain reserved for actual Python package releases
# from `services/*`, `sdk/python`, `packages/python`, etc. once those
# projects are workspace-ready.
#
