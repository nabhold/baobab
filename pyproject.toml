    "bandit>=1.8",

    # Secret detection
    "detect-secrets>=1.5",

    # Dependency vulnerability auditing
    "pip-audit>=2.9",

]

#  RELEASE TOOLING
# ----------------
# Packages used for packaging and publishing Python distributions.
#
# While the repository root is not distributed, individual packages within the
# workspace may use these tools during release pipelines.
#
release = [

    # Package builder
    "build>=1.3",

    # Package publishing
    "twine>=6.1",

]

#  UV CONFIGURATION
#
# UV is the official Python package manager for the Baobab Enterprise Platform.
#
# It is responsible for:
#
#   • Dependency resolution
#   • Virtual environment management
#   • Lock file generation
#   • Reproducible development environments
#   • Workspace management
#
# Baobab standardises on UV to provide a fast, reliable and reproducible
# development workflow across all Python services.
#
# Documentation
# -------------
#
#     https://docs.astral.sh/uv/
#
#

[tool.uv]

#  Repository Packaging Strategy
# ---------------------------
# The repository root is NOT a distributable Python package.
#
# Instead, it acts as the workspace root responsible for coordinating multiple
# independent Python projects.
#
# Therefore:
#
#     package = false
#
# prevents accidental packaging or publishing of the repository root while
# still allowing dependency management and workspace operations.
#
# This is also *why* `uv build` / `uv publish` must never be run against the
# repository root to "publish documentation" — there is no package here for
# those commands to act on. See "DOCUMENTATION BUILD & PUBLISH" at the end of
# this file for the correct command set.
#
package = false

#  Default Dependency Groups
#-------------
# These dependency groups are installed automatically when developers execute:
#
#     uv sync
#
# This provides a fully configured development environment without installing
# optional release or security tooling unless explicitly requested.
#
#
default-groups = [

    "dev",
    "quality",
    "docs",
    "test",

]

#  Dependency Management Philosophy
# --------------------
# The repository root manages ONLY developer tooling.
#
# Runtime dependencies belong exclusively to individual Python projects.
#
# Example
# -------
#
#     services/backend/
#         pyproject.toml
#
#     services/ai/
#         pyproject.toml
#
#     services/worker/
#         pyproject.toml
#
#     shared/python/
#         pyproject.toml
#
#     sdk/python/
#         pyproject.toml
#
#     packages/python/
#         pyproject.toml
#
# This separation provides:
#
#   • Independent releases
#   • Independent dependency graphs
#   • Smaller environments
#   • Faster dependency resolution
#   • Better security auditing
#
#
#  UV WORKSPACE READINESS ROADMAP
# ---------------------------------
#
# The Baobab Platform is architected as a scalable enterprise monorepo. As
# individual Python components mature into standalone packages, they should
# be enrolled into a shared UV workspace.
#
# STATUS AS OF THIS REVISION: every directory listed below already contains
# a `pyproject.toml` file in the tree, but these are confirmed PLACEHOLDERS,
# not complete, buildable Python projects. Do not confuse "file exists" with
# "ready to enroll" — that was an ambiguity in the prior revision of this
# file that this roadmap now resolves explicitly.
#
# A directory is READY to move from commented-out to an active workspace
# member only once ALL of the following are true:
#
#   1. Its pyproject.toml declares real name/version/dependencies — not an
#      empty scaffold.
#   2. `uv build` succeeds for that project in isolation.
#   3. At least a minimal test suite exists and passes under `pytest`.
#   4. Its CI workflow (.github/workflows/) exercises it independently
#      (e.g. backend.yml, python-app.yml) and is green.
#   5. It has been reviewed and signed off by the owning team lead.
#
#     Member                Owning area        Readiness status
#     --------------------  -----------------  --------------------------
#     services/backend      Backend            PLACEHOLDER — not ready
#     services/ai           AI Platform         PLACEHOLDER — not ready
#     services/worker        Platform Infra     PLACEHOLDER — not ready
#     shared/python          Platform Infra     PLACEHOLDER — not ready
#     packages/python        Platform Infra     PLACEHOLDER — not ready
#     sdk/python             Developer Exp.     PLACEHOLDER — not ready
#
# `plugins/connectors`, `plugins/customer_extensions`, `plugins/marketplace`
# and `plugins/reports` currently hold no pyproject.toml at all (only
# `.gitkeep`). If any of these becomes a real Python package, add it to the
# table above with PLACEHOLDER status before it can progress further.
#
# Update the status column (not just this comment block) as each member
# clears the checklist, and uncomment the corresponding entry in
# `[tool.uv.workspace].members` below only for members marked READY.
#
# [tool.uv.workspace]
#
# members = [
#
#     # ---------------------------------------------------------------
#     # Core Platform Services
#     # ---------------------------------------------------------------
#
#     "services/backend",
#     "services/ai",
#     "services/worker",
#
#     # ---------------------------------------------------------------
#     # Shared Platform Libraries
#     # ---------------------------------------------------------------
#
#     "shared/python",
#
#     # ---------------------------------------------------------------
#     # Reusable Python Packages
#     # ---------------------------------------------------------------
#
#     "packages/python",
#
#     # ---------------------------------------------------------------
#     # Public SDK
#     # ---------------------------------------------------------------
#
#     "sdk/python",
#
# ]
#
#  FUTURE SCALING
#
# As the platform evolves, additional Python projects may be added to the UV
# workspace without requiring changes to the repository architecture.
#
# Examples
# --------
#
#     plugins/connectors           (if it becomes a Python connector SDK)
#     plugins/customer_extensions  (if it becomes a Python extension API)
#     plugins/marketplace          (if it becomes a Python packaging surface)
#     plugins/reports              (if it becomes a Python reporting engine)
#     services/reporting
#     services/search
#     services/payments
#     services/analytics
#     services/integration
#     packages/data-science
#     sdk/python-enterprise
#
# The repository architecture has been intentionally designed so that adding a
# new Python service is primarily a matter of creating a new project directory
# with its own pyproject.toml and registering it as a workspace member once it
