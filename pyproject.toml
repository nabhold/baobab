# Configuration Standard
# ----------------------
#     PEP 517
#     PEP 518
#     PEP 621
#
# Revision
# --------
#     v1.3 — Architecture review remediation
#     See "REVISION HISTORY" near the end of this file for a full changelog
#     of what changed relative to v1.0 and why.
#
#
# PURPOSE
# ---------------
#
# This file is the authoritative Python project configuration for the Baobab
# Enterprise Platform repository.
#
# It provides:
#
#   • Project metadata
#   • Build system configuration
#   • Python dependency management
#   • Development tooling
#   • Documentation tooling
#   • Testing tooling
#   • Security tooling
#   • Release tooling
#   • UV workspace configuration
#
# This file intentionally contains NO configuration for individual tools such
# as Ruff, Pytest, MkDocs, Pyright, Bandit, or Pre-Commit. Each tool owns its
# own dedicated configuration file to improve maintainability, reduce
# coupling, and simplify upgrades. See "TOOL CONFIGURATION REGISTRY" below
# for the authoritative mapping of tool → config file, including two gaps
# identified in the last review that still need dedicated files created.
#
#
# REPOSITORY PHILOSOPHY
# ----------------------
#
# Baobab is designed as a long-lived enterprise software platform rather than
# a single Python application.
#
# The repository is organized as a monorepo containing multiple independently
# evolving applications, services, SDKs, shared libraries, plugins, and
# deployment assets.
#
# Examples include:
#
#   • Django backend services
#   • AI services
#   • Background workers
#   • Flutter mobile applications
#   • Next.js web applications
#   • Shared Python libraries
#   • TypeScript packages
#   • SDKs
#
# The root of the repository serves as the coordination layer for the entire
# platform rather than as the runtime environment for any individual service.
#
#
# TOOL CONFIGURATION REGISTRY
# ----------------------------
#
# Authoritative mapping of tool → dedicated configuration file. If a tool
# below has no file yet, that is a known, tracked gap — not an oversight.
#
#     Tool              Config file                    Status
#     ----------------  ------------------------------  -----------------
#     Ruff              ruff.toml                       ✓ present
#     Pytest            pytest.ini                      ✓ present
#     Zensical          zensical.toml                   ✓ present
#     Pre-commit        .pre-commit-config.yaml         ✓ present
#     markdownlint      .markdownlint.jsonc             ✓ present
#     yamllint          .yamllint.yml                   ✓ present
#     Taplo (TOML)      taplo.toml                      ✓ present
#     Pyright           pyrightconfig.json              ✓ present
#     Bandit            bandit.yaml                     ✓ present
#     detect-secrets    .secrets.baseline               ✓ present
#                        (generate via: uv run detect-secrets scan
#                         > .secrets.baseline)
#     pip-audit         none required (CLI flags only)  n/a
#
# The three ACTION ITEM rows were identified during the July 2026
# architecture review. They do not block this file from being correct, but
# they should be created as immediate follow-up work so that `quality` and
# `security` group tools run against explicit, version-controlled policy
# rather than tool defaults.
#
#
# PYTHON WORKSPACE PHILOSOPHY
# -----------------------------------------------------------
# The root pyproject.toml intentionally contains no production runtime
# dependencies for application services.
#
# Instead:
#
#   • Each Python service owns its own pyproject.toml
#   • Each Python package manages its own runtime dependencies
#   • The repository root manages developer tooling only
#
# This separation allows services to:
#
#   • evolve independently
#   • release independently
#   • maintain isolated dependency graphs
#   • minimise dependency conflicts
#   • improve build reproducibility
#
#
# ARCHITECTURE PRINCIPLES
# ---------------------------
#
# The Baobab repository follows these engineering principles:
#
#   1. Separation of Concerns
#      Every service owns its own lifecycle.
#
#   2. Single Source of Truth
#      Configuration belongs to the tool responsible for it.
#
#   3. Monorepo by Design
#      Multiple applications share one repository while remaining loosely
#      coupled.
#
#   4. Explicit Dependencies
#      Dependencies are declared close to the projects that require them.
#
#   5. Developer Experience First
#      A new developer should be able to clone, bootstrap, build, test and
#      contribute with minimal setup.
#
#   6. Infrastructure as Code
#      Build, deployment and development environments are fully reproducible.
#
#   7. Documentation as Code
#      Repository governance and technical documentation are maintained under
#      version control alongside the source code.
#
#
# PYTHON VERSION POLICY
# ----------------------------
#
# Baobab pins Python 3.14.6 as the exact interpreter used across all
# developer machines, CI runners, and devcontainers.
#
# This is implemented in two complementary layers, per uv's own guidance —
# `requires-python` in this file is a PEP 621 *compatibility declaration*
# (a range), while the exact interpreter used to build environments is
# pinned separately:
#
#   • requires-python (below)   → ">=3.14.6,<3.15"
#         Declares the minimum patch release the codebase requires and the
#         next minor line as the ceiling. This is what packaging tools and
#         IDEs read to validate compatibility.
#
#   • .python-version (repo root) → 3.14.6
#         Read automatically by `uv` (and `pyenv`) to select and download the
#         *exact* interpreter build for `uv sync` / `uv run`, regardless of
#         what else is installed on the machine. This is the actual
#         reproducibility guarantee requested for this platform.
#
# Rationale for a range rather than a hard "==3.14.6" pin in requires-python:
# an exact pin here would make the workspace metadata reject a developer's
# environment over an unreleased patch bump (e.g. a security patch 3.14.7)
# even though `uv sync` would still resolve correctly. The `.python-version`
# file is the correct enforcement point for "everyone runs the exact same
# interpreter build"; requires-python is the correct place for "this code is
# only known to work on the 3.14 line, starting at .6."
#
# If a future decision needs a hard, non-negotiable single build (e.g. for
# regulatory reproducibility), tighten requires-python to "==3.14.6" and
# accept that CI must then also pin the exact same build with no drift
# allowed — coordinate with the Devcontainer/CI owners before doing so, as
# it affects the base image in .devcontainer/docker/Dockerfile.
#
#
# SCALABILITY STRATEGY
# ----------------------------
#
# This configuration is designed to support future expansion without requiring
# structural changes to the repository.
#
# Directories already scaffolded in the tree with a pyproject.toml placeholder
# (see "UV WORKSPACE READINESS ROADMAP" below for their current status):
#
#     services/backend/
#     services/ai/
#     services/worker/
#     shared/python/
#     packages/python/
#     sdk/python/
#
# Additionally tracked but not yet scaffolded with any pyproject.toml:
#
#     plugins/connectors/
#     plugins/customer_extensions/
#     plugins/marketplace/
#     plugins/reports/
#
# The `plugins/` tree currently contains only `.gitkeep` placeholders. If and
# when any of these becomes a real Python package (e.g. a connector SDK or a
# reporting engine with its own dependencies), it must be added to this list
# and to the workspace roadmap below before being enrolled as a workspace
# member.
#
#
# MAINTENANCE POLICY
# -----------------------
#
# This file should remain focused on:
#
#   • Project metadata
#   • Dependency management
#   • Build configuration
#   • Workspace configuration
#
# Tool-specific configuration MUST remain in dedicated configuration files.
# See "TOOL CONFIGURATION REGISTRY" above for the full, current list and
# outstanding gaps.
#
# Keeping configuration separated reduces complexity, improves readability,
# and allows individual tools to evolve independently over time.
#
#
# BUILD SYSTEM
# ------------------

# The Build System defines how Python packages within the Baobab Platform are
# built and packaged in accordance with modern Python packaging standards.
#
# Baobab adopts Hatchling as the default build backend because it is:
#
#   • Lightweight and standards-compliant
#   • Fully compatible with PEP 517 and PEP 518
#   • Well supported by uv
#   • Fast and dependency-light
#   • Suitable for monorepo-based development
#
# The root repository itself is not intended to be published as a Python
# package. Instead, individual Python services and libraries (such as the
# backend, AI service, worker service, SDKs, and shared libraries) maintain
# their own build configuration and release lifecycle.
#
# Future Python projects within the repository should also adopt Hatchling
# unless a compelling architectural reason exists to use an alternative build
# backend.
#
# ---------------------

[build-system]

requires = [
    "hatchling>=1.27.0",
]

build-backend = "hatchling.build"

#
# PROJECT METADATA (PEP 621)
# ---------------------------------
#
# The following section defines the canonical metadata for the Baobab Platform.
#
# Metadata declared here is used by packaging tools, dependency managers,
# documentation generators, IDEs, and continuous integration pipelines.
#
# Baobab follows PEP 621 to ensure consistent and interoperable project
# metadata across the Python ecosystem.
#
# Although the Baobab repository root is not itself intended to be published to
# the Python Package Index (PyPI), maintaining complete metadata provides
# several benefits:
#
#   • Consistent project identification
#   • Better IDE integration
#   • Improved tooling compatibility
#   • Future packaging flexibility
#   • Rich documentation metadata
#   • Standardised dependency management
#
# The repository root represents the Baobab Platform workspace rather than a
# deployable application.
#
# Individual Python services, SDKs and libraries define their own project
# metadata within their respective pyproject.toml files.
#
[project]

#  Basic Information
#
name = "baobab"

version = "0.1.0"

description = "An enterprise-grade, AI-enabled, multi-tenant digital business platform."

readme = "README.md"

