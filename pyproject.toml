# ==============================================================================
# Baobab Enterprise Platform
# ==============================================================================
#
# File        : pyproject.toml
# Repository  : https://github.com/nabhold/baobab
# Organization: NABHOLD Group Africa
#
# ------------------------------------------------------------------------------
# PURPOSE
# ------------------------------------------------------------------------------
#
# This file is the authoritative Python project configuration for the Baobab
# Enterprise Platform monorepo.
#
# Responsibilities
# ----------------
# • Project metadata (PEP 621)
# • Build backend configuration
# • Python version requirements
# • Dependency management
# • Dependency groups (PEP 735)
# • uv configuration
# • Repository metadata
#
# Non-Responsibilities
# --------------------
# The following tools intentionally maintain their own configuration files:
#
#   mkdocs.yml                 Documentation
#   ruff.toml                  Ruff Linter
#   pytest.ini                 Pytest
#   .pre-commit-config.yaml    Git Hooks
#   taplo.toml                 TOML Formatter
#   .markdownlint.jsonc        Markdown Linting
#   .yamllint.yml              YAML Linting
#
# Keeping each tool isolated reduces coupling and allows independent evolution.
#
# ------------------------------------------------------------------------------
# PLATFORM
# ------------------------------------------------------------------------------
#
# Python        : 3.14+
# Package Tool  : uv
# Build Backend : Hatchling
#
# ==============================================================================

# ==============================================================================
# Build System
# ==============================================================================

[build-system]
requires = [
    "hatchling>=1.27"
]
build-backend = "hatchling.build"

# ==============================================================================
# Project Metadata (PEP 621)
# ==============================================================================

[project]

name = "baobab"

version = "0.1.0"

description = "Enterprise Multi-Tenant Digital Commerce Platform"

readme = "README.md"

requires-python = ">=3.14"

license = { text = "Proprietary" }

authors = [
    { name = "NABHOLD Group Africa" }
]

maintainers = [
    { name = "Baobab Engineering Team" }
]

keywords = [
    "enterprise",
    "erp",
    "crm",
    "commerce",
    "ai",
    "payments",
    "django",
    "fastapi",
    "multi-tenant",
    "platform"
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",

    "License :: Other/Proprietary License",

    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.14",

    "Topic :: Office/Business",

    "Topic :: Software Development",

    "Typing :: Typed"
]

# ------------------------------------------------------------------------------
# Runtime Dependencies
#
# Shared runtime dependencies only.
#
# Service-specific dependencies belong within each service/application.
# ------------------------------------------------------------------------------

dependencies = []

# ==============================================================================
# Project URLs
# ==============================================================================

[project.urls]

Homepage = "https://github.com/nabhold/baobab"

Repository = "https://github.com/nabhold/baobab"

Documentation = "https://nabhold.github.io/baobab"

Issues = "https://github.com/nabhold/baobab/issues"

# ==============================================================================
# Dependency Groups (PEP 735)
#
# Examples
# --------
#
#   uv sync
#
#   uv sync --group dev
#
#   uv sync --group docs
#
#   uv sync --group test
#
#   uv sync --all-groups
#
# ==============================================================================

[dependency-groups]

# ------------------------------------------------------------------------------
# Documentation
# ------------------------------------------------------------------------------

docs = [

    "mkdocs>=1.7",

    "mkdocs-material>=10",

    "mkdocstrings[python]>=0.30",

    "mkdocs-mermaid2-plugin>=1.2",

    "mkdocs-git-revision-date-localized-plugin>=1.4",

    "mkdocs-minify-plugin>=0.8",

    "pymdown-extensions>=10.16"

]

# ------------------------------------------------------------------------------
# Development
# ------------------------------------------------------------------------------

dev = [

    "ipython>=9.4",

    "pre-commit>=4.3",

    "watchfiles>=1.1"

]

# ------------------------------------------------------------------------------
# Testing
# ------------------------------------------------------------------------------

test = [

    "pytest>=8.4",

    "pytest-cov>=7",

    "pytest-xdist>=3.8"

]

# ------------------------------------------------------------------------------
# Formatting
# ------------------------------------------------------------------------------

format = [

    "black>=25"

]

# ------------------------------------------------------------------------------
# Linting
# ------------------------------------------------------------------------------

lint = [

    "ruff>=0.13"

]

# ------------------------------------------------------------------------------
# Static Type Checking
# ------------------------------------------------------------------------------

typecheck = [

    "pyright>=1.1"

]

# ------------------------------------------------------------------------------
# Security
# ------------------------------------------------------------------------------

security = [

    "bandit>=1.8",

    "detect-secrets>=1.5",

    "pip-audit>=2.9"

]

# ------------------------------------------------------------------------------
# Release & Packaging
# ------------------------------------------------------------------------------

release = [

    "build>=1.3",

    "twine>=6.2"

]

# ==============================================================================
# uv Configuration
# ==============================================================================

[tool.uv]

# ------------------------------------------------------------------------------
# Baobab is a monorepo rather than a distributable Python package.
#
# Setting package=false prevents accidental wheel creation while still allowing
# uv to manage dependency groups and lock files.
# ------------------------------------------------------------------------------

package = false

# ==============================================================================
# End of File
# ==============================================================================
