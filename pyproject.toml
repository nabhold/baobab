#
# This approach provides:
#
#   • Independent dependency graphs
#   • Independent service releases
#   • Faster dependency resolution
#   • Reduced dependency conflicts
#   • Cleaner security auditing
#   • Improved maintainability
#

dependencies = []

#  DEPENDENCY GROUPS
#
# CORRECTNESS NOTE (v1.2): these were previously declared under
# `[project.optional-dependencies]` (PEP 621 "extras"). That was a bug, not
# a style choice: `[tool.uv] default-groups` and the `--group` /
# `--only-group` / `--all-groups` flags used throughout this file and in
# `.github/workflows/deploy-docs.yml` only recognize PEP 735 dependency
# groups, declared under `[dependency-groups]` — a *different* table. The
# mismatch meant every `uv sync` invocation (including a bare `uv sync`)
# failed outright with:
#     error: Default group `dev` (from `tool.uv.default-groups`) is not
#     defined in the project's `dependency-groups` table
# This is now fixed by declaring the table below as `[dependency-groups]`.
# It is also the more architecturally correct choice, independent of the
# bug: these are internal developer-tooling buckets for an unpublished
# workspace root (`package = false`), not installable extras of a
# distributed package — PEP 735 groups are the right primitive for that,
# not PEP 621 optional-dependencies.
#
#
# Optional dependency groups provide tooling for developers without polluting
# production runtime environments.
#
# Dependency groups can be installed independently using uv.
#
# Examples
# --------
#
# Install all default development tools:
#
#     uv sync
#
# Install documentation tools only:
#
#     uv sync --group docs
#
# Install testing tools only:
#
#     uv sync --group test
#
# Install security tools only:
#
#     uv sync --group security
#
# Install release tooling only:
#
#     uv sync --group release
#
# Install every available group:
#
#     uv sync --all-groups
#
#
[dependency-groups]

#  DEVELOPMENT TOOLS
# ---------------------
# These packages improve the local developer experience.
#
# They are not required in production deployments.
#
# Responsibilities
# ----------------
#
#   • Interactive Python shell
#   • Git hooks
#   • Rich terminal output
#   • Automatic file watching
#

dev = [
