# Static analysis and code quality tools.
#
# These tools enforce coding standards and detect potential issues before code
# reaches production.
#
# NOTE: pyright is configured via a dedicated `pyrightconfig.json` at the
# repository root (see "TOOL CONFIGURATION REGISTRY" — currently an open
# action item). Until that file exists, pyright runs against its own
# built-in defaults, which is not yet policy-driven.
#
quality = [

    # Linting and formatting
    "ruff>=0.12",

    # Static type checking
    "pyright>=1.1",

]

#  DOCUMENTATION
# -------------
# Documentation tooling used to build the Baobab documentation portal.
#
# ARCHITECTURE DECISION (v1.3): single-version documentation, published via
# GitHub's native Pages Actions deployment (OIDC-based
# `actions/upload-pages-artifact` + `actions/deploy-pages`), NOT `mike`.
#
# `mike` was removed from this group after being identified as dead weight:
# it was declared here and documented as "the" publishing path, but
# `.github/workflows/deploy-docs.yml` never actually invoked it — the
# workflow implements the single-version model below. The two are
# genuinely incompatible, not just different flavours of the same thing:
# `mike` pushes commits to an orphan `gh-pages` branch and requires
# `contents: write` on the Actions bot token; the OIDC/Pages-Actions model
# this repository actually uses is deliberately narrower
# (`pages: write` + `id-token: write`, no `contents: write`) and deploys
# straight from a build artifact with no branch or commit involved.
#
# This was a deliberate decision, not just a bug fix, made on these
# grounds:
#   1. Security / least privilege — granting `contents: write` to an
#      automated pipeline (required by mike's branch-push model) is a
#      strictly larger supply-chain attack surface than the artifact-based
#      OIDC deployment already in place. Given a choice, we do not expand
#      write access from CI when a narrower mechanism already works.
#   2. Maintenance posture — Baobab does not currently commit to
#      supporting multiple concurrently-documented major versions (no
#      externally-versioned SDK/API with an LTS guarantee yet). A
#      "forward-only" single-version docs site matches that posture; if
#      that changes (e.g. once `sdk/python` ships a versioned public API),
#      this decision should be revisited alongside that milestone.
#   3. Repository hygiene — no orphan `gh-pages` branch accumulating
#      auto-generated HTML commits over time.
#
# See "DOCUMENTATION BUILD & PUBLISH — CORRECT UV COMMANDS" near the end of
# this file for the exact command sequence: `uv publish` and `uv build`
# are PyPI package release commands and are NOT used to publish
# documentation — using them against the repository root will fail, since
# `package = false` is set below.
#
# Version ranges intentionally remain within the current major release family
# to avoid unplanned breaking changes.
#
docs = [

    # Zensical documentation engine used by the GitHub Pages workflow.
    "zensical>=0.0.52",

]

