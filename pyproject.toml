#  REVISION HISTORY
# ------------------
#
# v1.3 (this revision)
#   • Removed `mike` from the `docs` group and rewrote the `docs` group's
#     header comment and the "DOCUMENTATION BUILD & PUBLISH" section to
#     describe the single-version, OIDC-based publishing model that
#     `.github/workflows/deploy-docs.yml` actually implements, instead of
#     the `mike`/`gh-pages`-branch model it never used. This was a
#     deliberate architecture decision (security/least-privilege,
#     maintenance posture, repository hygiene — see the `docs` group
#     comment for the full rationale), not a bug fix; `deploy-docs.yml`
#     itself was left unchanged.
#
# v1.2
#   • Fixed a severe bug: dependency groups (`dev`, `quality`, `docs`,
#     `test`, `security`, `release`) were declared under
#     `[project.optional-dependencies]` (PEP 621 extras), but
#     `[tool.uv] default-groups` and every `--group`/`--only-group`
#     command in this file and in `deploy-docs.yml` only recognize PEP 735
#     `[dependency-groups]`. This mismatch made every `uv sync` invocation
#     fail outright, including a bare `uv sync` — confirmed and reproduced
#     before fixing. Renamed the table to `[dependency-groups]` and
#     re-verified `uv sync`, `uv sync --only-group docs`, and
#     `uv run mkdocs` / `uv run mike` end-to-end.
#   • Tightened the `mkdocs` pin from `>=1.6,<1.7` to `>=1.6,<=1.6.1` after
#     discovering `mkdocs-redirects` itself caps `mkdocs<=1.6.1` — the
#     wider range only worked by coincidence (1.6.1 being the newest
#     1.6.x release at the time) and would have failed resolution outright
#     the moment mkdocs shipped 1.6.2.
#
# v1.1
#   • Pinned Python to 3.14.6: requires-python narrowed from an open-ended
#     ">=3.14" to ">=3.14.6,<3.15", paired with a new root-level
#     `.python-version` file (exact pin, read by `uv`/`pyenv`).
#   • Removed a duplicated `mkdocstrings` dependency declaration in the
#     `docs` group (both a bare and an `[python]`-extra entry existed;
#     kept only the extra form).
#   • Added the "TOOL CONFIGURATION REGISTRY" documenting which tools have
#     dedicated config files and flagging three that do not yet
#     (pyrightconfig.json, bandit.yaml, .secrets.baseline) as tracked
#     action items rather than silent gaps.
#   • Replaced the ambiguous UV workspace activation comment with an
#     explicit "UV WORKSPACE READINESS ROADMAP" status table, since the
#     prior wording's stated precondition ("every directory contains a
#     pyproject.toml") was already technically true via placeholder files,
#     which was not the intent.
#   • Added `plugins/*` to the tracked future-scaling list; it was
#     previously present in the repository tree but absent from this file.
#   • Added the "DOCUMENTATION BUILD & PUBLISH" command reference to
#     eliminate the recurring error of running `uv build` / `uv publish`
#     against the (unpackaged) repository root when the actual goal was to
#     publish MkDocs documentation.
#
# v1.0
#   • Initial root workspace configuration.
#
#
#  END OF CONFIGURATION
# ---------------------
# The sections above define the repository-level Python configuration for the
# Baobab Enterprise Platform.
#
# Individual Python services, SDKs and shared libraries should maintain their
# own pyproject.toml files for runtime dependencies, packaging and release
# configuration.
#
# This separation ensures the repository remains modular, maintainable and
# scalable as the platform grows.
