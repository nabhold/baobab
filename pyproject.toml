# Runtime dependencies belong exclusively to the individual Python services
# within the monorepo.
#
# Examples:
#
#     services/backend/
#     services/ai/
#     services/worker/
#     shared/python/
#     sdk/python/
#     packages/python/
#
# This design keeps the repository root lightweight while allowing each service
# to evolve independently with its own dependency graph and release cadence.
#
# Examples
# --------
#
#     services/backend/
#         Django
#         Django REST Framework
#         django-tenants
#         psycopg
#
#     services/ai/
#         FastAPI
#         LangChain
