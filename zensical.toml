# ==============================================================================
# Baobab Enterprise Platform
# ==============================================================================
#
# File        : zensical.toml
# Repository  : https://github.com/nabhold/baobab
# Organization: Nabhold Group Africa
# Version     : v1.0 (Zensical schema remediation)
#
# ------------------------------------------------------------------------------
# PURPOSE
# ------------------------------------------------------------------------------
# Authoritative Zensical configuration for the Baobab Enterprise Platform.
# Migrated from MkDocs Material to Zensical for improved build performance,
# modern web standards, and native TOML-driven documentation architecture.
#
# ------------------------------------------------------------------------------
# v1.0 REMEDIATION NOTES — read before editing this file
# ------------------------------------------------------------------------------
#
# The previous revision of this file was audited against the official
# Zensical documentation (https://zensical.org/docs/, tracking release
# ~0.0.52) rather than assumed to be a drop-in port of mkdocs.yml. Several
# defects were found and corrected. This is NOT the same schema as MkDocs —
# do not "fix" this file by copying blocks back out of mkdocs.yml.
#
# THE SINGLE MOST IMPORTANT RULE
# -------------------------------
# A zensical.toml file has exactly ONE top-level scope: [project]. Per the
# official "Basics" guide: "A zensical.toml configuration begins with a line
# declaring a scope for the project ... As of now, all settings are contained
# within this scope." Any table declared outside [project] (e.g. a bare
# [theme.palette] or a bare [validation]) is not part of Zensical's schema at
# that path. TOML parsers do not error on unrecognized tables — they are
# simply dropped, silently, with no build warning. This is the same failure
# class ("keys nested in the wrong place, no error, feature quietly does
# nothing") that we already hit once with MkDocs's `validation:` block — it
# is more pervasive in Zensical because scoping discipline matters for
# EVERY setting, not just validation.
#
# DEFECTS FOUND AND FIXED IN THIS REVISION
# -----------------------------------------
# 1. [theme.palette] / [theme.font] (top-level, outside [project])
#      → Wrong scope entirely. Zensical has no top-level `theme` key.
#      → Fixed: consolidated into a single [project.theme] table.
#
# 2. Palette structure itself was the wrong SHAPE, not just the wrong scope.
#    The old file declared one [theme.palette] table plus a separate
#    [[theme.palette.toggle]] array. Zensical's actual mechanism makes the
#    palette ITSELF the array-of-tables: [[project.theme.palette]], with
#    each entry carrying its own `media`, `scheme`, and `toggle.icon` /
#    `toggle.name`. The old structure would not have produced a working
#    light/dark toggle — it would have silently done nothing.
#      → Fixed below using [[project.theme.palette]] per scheme.
#
# 3. Bare top-level `features = [...]`
#      → Wrong scope. Feature flags belong to the theme.
#      → Fixed: moved under [project.theme].
#
# 4. Bare top-level `language = "en"`
#      → This is a top-level key in MkDocs but moved under the theme scope
#        in Zensical.
#      → Fixed: moved to [project.theme].language.
#
# 5. `name = "zensical"` under the old [project.theme] block
#      → Not a documented Zensical setting. Zensical does not have a
#        "theme name" selector the way MkDocs does (theme.name: material).
#        It only exposes `variant` ("modern" | "classic"). This was almost
#        certainly a leftover translation artefact from mkdocs.yml's
#        `theme: name: material` and has been removed.
#
# 6. [validation] (top-level) using MkDocs's nav.*/links.* nested schema
#    with string values ("warn")
#      → This is verbatim MkDocs schema, not Zensical's. Confirmed against
#        https://zensical.org/docs/setup/validation/: Zensical's validation
#        block is FLAT, uses BOOLEANS (not "warn"/"ignore" strings), is
#        scoped [project.validation], and has no nav/links subdivision.
#        Recognized keys: invalid_links, invalid_link_anchors, plus six
#        deprecated checks (unresolved_references, unresolved_footnotes,
#        unused_definitions, unused_footnotes, shadowed_definitions,
#        shadowed_footnotes) — deprecated because the current parser has
#        edge cases; Zensical Studio's parser will eventually replace them.
#      → Fixed below with the correct flat/boolean schema.
#
# WHAT WAS ALREADY CORRECT
# --------------------------
# - project.markdown_extensions.pymdownx.emoji: the emoji_generator /
#   emoji_index string values matched the official docs exactly. No change.
# - nav, extra_css, extra_javascript, repo_url, repo_name, edit_uri,
#   docs_dir, site_dir, site_* keys: correctly scoped under [project]
#   already. No change.
#
# DECISIONS CONFIRMED WITH ENGINEERING (2026-08-03)
# ----------------------------------------------------
# 1. FONTS: font = false (system font stack). This preserves the security
#    decision already made for the MkDocs build — no requests to Google
#    Fonts' CDN. The previous Plus Jakarta Sans / JetBrains Mono selection
#    would have loaded both from fonts.googleapis.com at runtime, which
#    directly contradicted that decision.
#
# 2. THEME VARIANT: "modern" (Zensical's new design language), NOT
#    "classic" (the variant that pixel-matches Material for MkDocs).
#    Rationale: Material-for-MkDocs compatibility in Zensical is a
#    transitional affordance, not a long-term guarantee — the "classic"
#    variant exists to ease migration, not as a permanent target. Engineering
#    has explicitly chosen to align with Zensical's forward direction rather
#    than lock into a compatibility mode that may eventually be deprecated.
#
#    ACTION REQUIRED — CSS COMPATIBILITY: the existing eight-partial
#    extra.css architecture (palette.css, dark.css, typography*.css,
#    layout.css, components.css, utilities.css, animations.css) and the
#    WCAG contrast audit (--baobab-gold-dark, etc.) were built and verified
#    against Material for MkDocs' DOM/CSS-variable surface. Zensical's
#    "modern" variant uses the same HTML structure per official docs
#    ("The HTML structure of Zensical matches that of Material for MkDocs
#    in both theme variants"), which is reassuring, but this claim has NOT
#    been empirically verified against our specific CSS in a real
#    `zensical build` yet. Treat that verification as a required follow-up
#    task before this file is treated as production-ready — do not assume
#    parity from documentation claims alone (see project convention:
#    validate empirically against real tools).
#
# 3. ICON SET FOR PALETTE TOGGLE: lucide/* (the documented convention —
#    every official Zensical example for theme.palette.toggle.icon uses
#    lucide/sun, lucide/moon, etc.). The previous material/brightness-7 /
#    material/brightness-3 icon paths were not confirmed valid for this
#    specific field in the official docs and have been replaced.
#
# OUTSTANDING / NOT ADDRESSED IN THIS REVISION
# -----------------------------------------------
# - extra_css / extra_javascript path mismatch between this file
#   ("assets/stylesheets/extra.css", "assets/javascripts/extra.js") and
#   mkdocs.yml ("assets/css/extra.css", "assets/js/extra.js"). If both
#   config files are meant to build the SAME docs/ tree, only one of these
#   directory conventions can be correct — this needs an explicit decision
#   (rename one set of directories, or decide zensical.toml supersedes
#   mkdocs.yml entirely) before both builds can be trusted concurrently.
#   Left unchanged pending that decision; flagging here so it is not
#   silently forgotten.
# - Favicon / logo: still no real assets in the repository (see the
#   equivalent note in mkdocs.yml). Left unset so Zensical's default
#   is used gracefully rather than pointing at a non-existent file.
# - Full empirical validation via `zensical build --strict` has not yet
#   been run against this file. Recommended as the next step before merge.
# ==============================================================================


# ==============================================================================
# [project] — Site Metadata, Repository Integration, Structure
# ==============================================================================
# Per https://zensical.org/docs/setup/basics/, ALL settings live under this
# single [project] scope unless a setting's own documentation says otherwise
# (theme.*, markdown_extensions.*, and validation.* are sub-tables of this
# same [project] scope — they are not independent top-level tables).

[project]

site_name = "Baobab"
site_description = "Enterprise-grade multi-tenant platform architecture for Nabhold Group Africa and operating subsidiaries."
site_author = "Nabhold Group Africa"

# site_url is REQUIRED (not just recommended) once navigation.instant or
# instant previews are enabled below — both rely on the generated
# sitemap.xml, which is empty without this setting.
site_url = "https://nabhold.github.io/baobab/"

copyright = "Copyright © 2026 Nabhold Group Africa (Pty) Ltd. All rights reserved."

# ------------------------------------------------------------------------------
# Repository Integration
# ------------------------------------------------------------------------------
repo_name = "nabhold/baobab"
repo_url = "https://github.com/nabhold/baobab"

# edit_uri is concatenated with repo_url and the docs_dir-relative path of
# the current Markdown file to build the "Edit this page" link.
edit_uri = "edit/main/docs/"

# ------------------------------------------------------------------------------
# Directories
# ------------------------------------------------------------------------------
# Both paths are resolved relative to this configuration file.
# NOTE: docs_dir cannot currently be set to "." (a documented, temporary
# Zensical limitation) — not applicable here since we already use a
# dedicated docs/ subdirectory.
docs_dir = "docs"
site_dir = "site"

# ------------------------------------------------------------------------------
# Custom Styling / Scripting Assets
# ------------------------------------------------------------------------------
# Paths are relative to docs_dir. See the "OUTSTANDING" note at the top of
# this file regarding the directory-naming mismatch with mkdocs.yml.
extra_css = [
    "assets/stylesheets/extra.css"
]

extra_javascript = [
    "assets/javascripts/extra.js"
]

# ==============================================================================
# Navigation Hierarchy
# ==============================================================================
# `nav` is a [project]-scoped key (NOT nested under theme). Explicit nav
# definitions use TOML inline tables: {"Title" = "path.md"} for a single
# page, {"Title" = [...]} for a section. Confirmed against
# https://zensical.org/docs/setup/navigation/.

nav = [
    { "Home" = "index.md" },
    { "Architecture" = [
        { "Overview" = "architecture/overview.md" },
        { "Multi-Tenancy (django-tenants)" = "architecture/multi-tenancy.md" },
        { "Database Schema Design" = "architecture/database-schemas.md" },
        { "API Contracts & DRF" = "architecture/api-contracts.md" },
        { "Authentication & RBAC" = "architecture/auth-rbac.md" }
    ]},
    { "Governance" = [
        { "Coding Standards" = "governance/coding-standards.md" },
        { "Compliance & Security" = "governance/compliance.md" }
    ]},
    { "Infrastructure" = [
        { "Devcontainers & Codespaces" = "infrastructure/codespaces.md" },
        { "Docker & Multi-Arch Build" = "infrastructure/docker-build.md" },
        { "CI/CD Pipelines" = "infrastructure/cicd.md" }
    ]},
    { "Subsidiaries" = [
        { "Thamani Global B2B" = "subsidiaries/thamani-global.md" }
    ]},
    { "ADRs (Architecture Decision Records)" = [
        { "Index" = "adr/index.md" },
        { "0001 - Django Monolith with Schema Isolation" = "adr/0001-django-monolith.md" },
        { "0002 - Adopting Zensical for Documentation" = "adr/0002-adopting-zensical.md" }
    ]}
]


# ==============================================================================
# [project.theme] — Appearance, Typography, Language, Features
# ==============================================================================
# Everything theme-related is consolidated into ONE table at the correct
# scope. Do not re-split this into a bare [theme.*] table elsewhere in the
# file — that was the root cause of defects #1–#5 in the previous revision.

[project.theme]

# --------------------------------------------------------------------------
# Theme variant — CONFIRMED DECISION: "modern"
# --------------------------------------------------------------------------
# "modern"  → Zensical's new default design language (chosen).
# "classic" → pixel-matches Material for MkDocs; intended as a migration
#             aid, not a permanent target. See v1.0 remediation notes above
#             for the rationale and the required CSS-compatibility
#             follow-up task.

name = "zensical"
variant = "modern"

custom_dir = "overrides"
# logo = "assets/images/logo.png"
# favicon = "assets/images/favicon.png"

# --------------------------------------------------------------------------
# Language — moved here from the old (incorrect) top-level [project] key.
# --------------------------------------------------------------------------

language = "en"

# --------------------------------------------------------------------------
# Fonts — CONFIRMED DECISION: font = false
# --------------------------------------------------------------------------
# Disables Google Fonts loading entirely and falls back to the system font
# stack. This preserves the platform's existing security/governance
# position of zero third-party network requests for typography — the same
# reasoning already applied to the MkDocs build. Read more:
# https://zensical.org/docs/setup/fonts/#autoloading
font = false

# --------------------------------------------------------------------------
# Feature Flags
# --------------------------------------------------------------------------
# Moved here from the old (incorrect) top-level `features = [...]` key.
# Flags directly confirmed against official Zensical setup docs during this
# audit are marked [✓]; the remainder are Material-for-MkDocs-parity flags
# that Zensical documents itself as supporting via its compatibility layer,
# but have NOT yet been individually build-tested against this project's
# CSS in Zensical's "modern" variant — validate empirically with
# `zensical build --strict` before treating this list as final.

features = [
    # Navigation UX features
    "navigation.instant",           # [✓] requires site_url (set above)
    "navigation.instant.prefetch",
    "navigation.instant.progress",  # [✓]
    "navigation.tracking",
    "navigation.tabs",               # [✓]
    "navigation.tabs.sticky",        # [✓]
    "navigation.sections",           # [✓]
    "navigation.expand",             # [✓]
    "navigation.path",               # [✓]
    "navigation.indexes",            # [✓]
    "navigation.top",                # [✓] back-to-top button
    "navigation.footer",

    # Content & Code Authoring
    "content.code.annotate",
    "content.code.copy",             # [✓]
    "content.code.select",
    "content.action.edit",           # [✓]
    "content.action.view",           # [✓]
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",

    # Search Experience
    "search.suggest",
    "search.highlight",
    "search.share",

    # Table of contents
    "toc.follow",                    # [✓]
]

# --------------------------------------------------------------------------
# Icons — content action buttons (edit/view) and repository icon.
# --------------------------------------------------------------------------
# These use the material/* and fontawesome/* icon namespaces, both of which
# are confirmed bundled and valid for THIS field per
# https://zensical.org/docs/setup/repository/#repository-icon and
# https://zensical.org/docs/setup/repository/#icons — this is a separate,
# already-documented usage from the palette-toggle icon question below.

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"


# ==============================================================================
# Color Palette — light / dark scheme toggle
# ==============================================================================
# CONFIRMED STRUCTURAL FIX: theme.palette is itself an array of tables
# ([[project.theme.palette]]), one entry per scheme, each carrying its own
# `media` query and `toggle` block. This replaces the previous (non-
# functional) single-table-plus-separate-toggle-array structure.
#
# CONFIRMED DECISION: toggle icons use the "lucide" icon set, per the
# documented convention at https://zensical.org/docs/setup/colors/
# (every official example for theme.palette.toggle.icon uses lucide/*).

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"


# ==============================================================================
# Markdown Extensions & Parsing Rules
# ==============================================================================
# Already correctly scoped under [project.markdown_extensions.*] in the
# previous revision — retained unchanged, including the emoji generator/
# index configuration, which matched the official docs exactly.

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]


# ==============================================================================
# [project.validation] — Build-Time Link Validation
# ==============================================================================
# CONFIRMED STRUCTURAL FIX: this replaces the previous top-level
# [validation] block, which used MkDocs's nested nav.*/links.* schema with
# string values ("warn") — a schema Zensical does not implement at all.
#
# Zensical's actual validation schema (confirmed at
# https://zensical.org/docs/setup/validation/) is FLAT and BOOLEAN:
#   invalid_links         — warn when a link points to a page that doesn't
#                            exist (enabled by default; set explicitly here
#                            for self-documentation).
#   invalid_link_anchors   — warn when a link points to a non-existent
#                            anchor (enabled by default; explicit here).
#
# Six further checks exist but are marked DEPRECATED by Zensical itself —
# "too many edge cases that the current approach could not cover" — and are
# disabled by default as of recent releases. They remain available but are
# left OFF here deliberately, consistent with this project's convention of
# not enabling unstable/experimental checks in a production config without
# an explicit decision to do so. Flip any of these to `true` only after
# confirming the false-positive rate is acceptable for this docs tree.
[project.validation]
invalid_links = true
invalid_link_anchors = true

# Deprecated / unstable checks — intentionally left disabled.
unresolved_references = false
unresolved_footnotes = false
unused_definitions = false
unused_footnotes = false
shadowed_definitions = false
shadowed_footnotes = false

# ------------------------------------------------------------------------------
# Enforcing validation in CI
# ------------------------------------------------------------------------------
# Validation warnings do NOT fail the build by default. Strict enforcement
# is a command-line flag, not a config setting:
#     zensical build --strict
# This belongs in the (still outstanding) deploy-docs.yml GitHub Actions
# workflow remediation, not in this file.


[project.extra]
generator = false


# ==============================================================================
# End of File
