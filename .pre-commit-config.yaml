
# ==============================================================================
# Baobab Enterprise Platform
# ==============================================================================
#
# File        : .pre-commit-config.yaml
# Repository  : https://github.com/nabhold/baobab
# Organization: NABHOLD Group Africa
#
# ------------------------------------------------------------------------------
# PURPOSE
# ------------------------------------------------------------------------------
#
# This file defines the Git pre-commit hooks executed before every commit.
#
# Objectives
# ----------
#
# • Maintain consistent code quality
# • Detect common mistakes early
# • Enforce repository standards
# • Reduce CI failures
# • Improve developer productivity
#
# Installation
# ------------
#
#     uv run pre-commit install
#
# Manual Execution
# ----------------
#
#     uv run pre-commit run --all-files
#
# Automatic Execution
# -------------------
#
# Hooks execute automatically on every git commit.
#
# Documentation
# -------------
#
# https://pre-commit.com
#
# ==============================================================================

minimum_pre_commit_version: "4.3.0"

default_install_hook_types:
  - pre-commit

default_stages:
  - pre-commit

fail_fast: false

exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      site/|
      build/|
      dist/|
      node_modules/|
      \.next/|
      coverage/|
      htmlcov/
  )

repos:

# ==============================================================================
# Generic Repository Hygiene
# ==============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0

    hooks:

      - id: check-added-large-files
        args: ["--maxkb=2048"]

      - id: check-case-conflict

      - id: check-executables-have-shebangs

      - id: check-json

      - id: check-merge-conflict

      - id: check-symlinks

      - id: check-toml

      - id: check-yaml
        args: ["--allow-multiple-documents"]

      - id: debug-statements

      - id: detect-private-key

      - id: end-of-file-fixer

      - id: mixed-line-ending
        args: ["--fix=lf"]

      - id: trailing-whitespace

# ==============================================================================
# Ruff
# ==============================================================================

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0

    hooks:

      - id: ruff
        args:
          - --fix

      - id: ruff-format

# ==============================================================================
# Markdown
# ==============================================================================

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1

    hooks:

      - id: markdownlint-cli2

# ==============================================================================
# YAML
# ==============================================================================

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1

    hooks:

      - id: yamllint

# ==============================================================================
# TOML
# ==============================================================================

  - repo: https://github.com/tamasfe/taplo
    rev: 0.10.0

    hooks:

      - id: taplo-format

      - id: taplo-lint

# ==============================================================================
# Security
# ==============================================================================

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0

    hooks:

      - id: detect-secrets

# ==============================================================================
# End of File
# ==============================================================================
