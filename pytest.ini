###############################################################################
# Baobab Enterprise Platform
###############################################################################
#
# File        : pytest.ini
# Repository  : https://github.com/nabhold/baobab
# Organization: NABHOLD Group Africa
#
#------------------------------------------------------------------------------
# PURPOSE
#------------------------------------------------------------------------------
#
# This file is the authoritative configuration for the Pytest test framework.
#
# Responsibilities
# ----------------
#
# • Test discovery
# • Test execution defaults
# • Output formatting
# • Test markers
# • Warning management
#
# Documentation
# -------------
#
# https://docs.pytest.org
#
###############################################################################

[pytest]

###############################################################################
# Test Discovery
###############################################################################

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

testpaths =
    tests

###############################################################################
# Python Path
###############################################################################

pythonpath =
    .

###############################################################################
# Default Options
###############################################################################

addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short
    --color=yes

###############################################################################
# Console Output
###############################################################################

console_output_style = progress

###############################################################################
# Logging
###############################################################################

log_cli = true

log_cli_level = INFO

log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

log_cli_date_format = %Y-%m-%d %H:%M:%S

###############################################################################
# Warnings
###############################################################################

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

###############################################################################
# Custom Markers
###############################################################################

markers =

    unit:
        Unit tests

    integration:
        Integration tests

    api:
        API tests

    performance:
        Performance tests

    security:
        Security tests

    e2e:
        End-to-end tests

    slow:
        Long-running tests

###############################################################################
# End of File
###############################################################################
